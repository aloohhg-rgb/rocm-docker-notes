# llama.cpp HIP / ROCm server stub.
# Build your own image or point at a community one that actually has HIP enabled.
services:
  llamacpp:
    image: local/llama-cpp-hip:latest   # build yourself — see notes/build-llamacpp.md
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
    ports:
      - "8080:8080"
    environment:
      - GGML_HIP=1
    command:
      - "-m"
      - "/models/${MODEL_FILE:-model.Q4_K_M.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-ngl"
      - "999"
